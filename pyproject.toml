[project]
name = "threadsift"
version = "0.1.0"
description = "Collect Threads posts and replies and review them to find users with one chosen trait"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "patchright>=1.64.3",
    "playwright>=1.64.1",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.6",
    "typer>=0.27.3",
]

[project.scripts]
threadsift = "threadsift.cli:app"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pgserver>=0.1.4",
    "pytest>=9.2.0",
]
