# Copy to config.toml (git-ignored) and edit. Every key below shows its default.
# Ranges are [low, high]; a random value in the range is drawn each time.
# Safety first: when in doubt, choose slower and smaller. Lower values raise the
# risk of the collecting account being restricted or banned.

[database]
# Also settable with THREADSIFT_DATABASE_URL. The default connects as the dedicated
# role "threadsift" to the local server. The password is not kept here: put it in
# ~/.pgpass (see the README), which the Postgres client reads by itself.
url = "postgresql://threadsift@localhost/threadsift"

[browser]
# Relative paths are resolved against the directory you run threadsift from.
session_dir = ".session"
# A visible window is less detectable than headless; headless is not recommended.
headless = false
channel = "chrome"
# "patchright", or "playwright" as a fallback that leaks more automation signals.
backend = "patchright"

[pacing]
# Wait between page actions (scroll, expand replies, open a page).
action_pause_seconds = [4, 12]
# Wait between URLs.
url_pause_seconds = [30, 90]
# Extra stay on a page per character of visible text, with +/- jitter (fraction).
dwell_seconds_per_char = 0.01
dwell_jitter = 0.25
# Only about a screenful of text is "read": longer pages do not mean longer stays.
dwell_max_chars = 2000
# A long break after this many processed URLs...
urls_per_break = [10, 15]
# ...lasting this many minutes.
break_minutes = [3, 8]
# Length of the home-feed browse at the start of each run.
warmup_minutes = [1, 3]

[limits]
urls_per_run = 60
# Page actions (opening a page, each scroll step, each click) per URL and per run.
url_action_budget = 150
run_action_budget = 1200
# Secondary limits on a URL's reply tree.
max_replies = 1000
max_depth = 5

[cooldown]
# Hours before a new run is allowed after a run ended blocked / on early warning.
blocked_hours = 24
early_warning_hours = 6

[early_warning]
# Reveal actions in a row that load nothing while more replies are known to exist.
empty_reveals = 3
# More than this share of the last `failure_window` GraphQL responses failing or empty.
failure_window = 20
failure_ratio = 0.3
# Median load time of the last `slowdown_pages` pages above this multiple of the
# median of the first `slowdown_pages` pages after the warm-up.
slowdown_pages = 5
slowdown_factor = 3.0
